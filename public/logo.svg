<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#34d399"/>
    <stop offset="100%" style="stop-color:#059669"/>
  </linearGradient>
  <style type="text/css">
    .z-breathe {
      animation: breathe 2.5s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
  </style>
</defs>
<g>
  <!-- Rounded square background -->
  <rect x="1.5" y="1.5" width="27" height="27" rx="8" ry="8" fill="url(#catGrad)"/>
  <!-- Cat face -->
  <g class="z-breathe" fill="white">
    <!-- Left ear -->
    <path d="M7.5 11L5 4.5L9.5 9L7.5 11Z" opacity="0.9"/>
    <!-- Right ear -->
    <path d="M22.5 11L25 4.5L20.5 9L22.5 11Z" opacity="0.9"/>
    <!-- Inner left ear -->
    <path d="M7.8 10L6.5 6L9.2 8.5L7.8 10Z" opacity="0.4"/>
    <!-- Inner right ear -->
    <path d="M22.2 10L23.5 6L20.8 8.5L22.2 10Z" opacity="0.4"/>
    <!-- Head -->
    <ellipse cx="15" cy="14.5" rx="8.5" ry="7" />
    <!-- Eyes -->
    <ellipse cx="12" cy="13.5" rx="1.5" ry="1.8" fill="url(#catGrad)" opacity="0.25"/>
    <ellipse cx="18" cy="13.5" rx="1.5" ry="1.8" fill="url(#catGrad)" opacity="0.25"/>
    <!-- Pupils -->
    <ellipse cx="12" cy="13.5" rx="0.7" ry="1.1" fill="url(#catGrad)"/>
    <ellipse cx="18" cy="13.5" rx="0.7" ry="1.1" fill="url(#catGrad)"/>
    <!-- Eye shine -->
    <circle cx="12.4" cy="13" r="0.3" fill="white" opacity="0.9"/>
    <circle cx="18.4" cy="13" r="0.3" fill="white" opacity="0.9"/>
    <!-- Nose -->
    <path d="M14.3 15.5L15 16L15.7 15.5" stroke="url(#catGrad)" stroke-width="0.6" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mouth -->
    <path d="M15 16C15 16 13.8 16.8 13.3 16.6" stroke="url(#catGrad)" stroke-width="0.5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <path d="M15 16C15 16 16.2 16.8 16.7 16.6" stroke="url(#catGrad)" stroke-width="0.5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="3" y1="13" x2="9.5" y2="14" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="3" y1="15" x2="9.5" y2="15" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="3.5" y1="17" x2="9.5" y2="16" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="27" y1="13" x2="20.5" y2="14" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="27" y1="15" x2="20.5" y2="15" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="26.5" y1="17" x2="20.5" y2="16" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.4" stroke-linecap="round"/>
    <!-- Bell collar -->
    <path d="M10 18.5C10 18.5 12.5 19.5 15 19.5C17.5 19.5 20 18.5 20 18.5" stroke="url(#catGrad)" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- Bell -->
    <circle cx="15" cy="20" r="1.2" fill="url(#catGrad)" opacity="0.3"/>
    <circle cx="15" cy="20" r="0.5" fill="url(#catGrad)" opacity="0.5"/>
    <line x1="15" y1="19.5" x2="15" y2="20.5" stroke="url(#catGrad)" stroke-width="0.4" opacity="0.4"/>
  </g>
</g>
</svg>
