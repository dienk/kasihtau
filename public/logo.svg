<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#34d399"/>
    <stop offset="100%" style="stop-color:#059669"/>
  </linearGradient>
  <style type="text/css">
    .z-breathe {
      animation: breathe 2.5s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
  </style>
</defs>
<g>
  <!-- Rounded square background -->
  <rect x="1.5" y="1.5" width="27" height="27" rx="8" ry="8" fill="url(#catGrad)"/>
  <!-- Full body cat -->
  <g class="z-breathe" fill="white">
    <!-- Tail -->
    <path d="M21 20C24 18.5 25.5 15.5 25 12.5C24.7 11.2 23.8 10.5 22.8 10.8" stroke="white" stroke-width="1.6" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M22.8 10.8C22 11.2 21.7 12.2 22.3 12.8" stroke="white" stroke-width="1.3" fill="none" opacity="0.6" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="14" cy="21" rx="6.5" ry="5" />
    <!-- Belly patch -->
    <ellipse cx="14" cy="21.5" rx="3.8" ry="3.5" opacity="0.15" fill="url(#catGrad)"/>
    <!-- Left paw -->
    <ellipse cx="10" cy="25.5" rx="1.8" ry="0.9" />
    <!-- Right paw -->
    <ellipse cx="18" cy="25.5" rx="1.8" ry="0.9" />
    <!-- Paw pads -->
    <circle cx="9.3" cy="25.6" r="0.35" fill="url(#catGrad)" opacity="0.3"/>
    <circle cx="10.7" cy="25.6" r="0.35" fill="url(#catGrad)" opacity="0.3"/>
    <circle cx="17.3" cy="25.6" r="0.35" fill="url(#catGrad)" opacity="0.3"/>
    <circle cx="18.7" cy="25.6" r="0.35" fill="url(#catGrad)" opacity="0.3"/>
    <!-- Left ear -->
    <path d="M7.5 9.5L4.5 2L9.8 7.5L7.5 9.5Z" opacity="0.9"/>
    <!-- Right ear -->
    <path d="M20.5 9.5L23.5 2L18.2 7.5L20.5 9.5Z" opacity="0.9"/>
    <!-- Inner left ear -->
    <path d="M7.9 8.5L6 4L9.5 7L7.9 8.5Z" opacity="0.4" fill="url(#catGrad)"/>
    <!-- Inner right ear -->
    <path d="M20.1 8.5L22 4L18.5 7L20.1 8.5Z" opacity="0.4" fill="url(#catGrad)"/>
    <!-- Head -->
    <ellipse cx="14" cy="12" rx="7" ry="5.8" />
    <!-- Eyes -->
    <ellipse cx="11" cy="11.5" rx="1.5" ry="1.7" fill="url(#catGrad)" opacity="0.2"/>
    <ellipse cx="17" cy="11.5" rx="1.5" ry="1.7" fill="url(#catGrad)" opacity="0.2"/>
    <!-- Pupils -->
    <ellipse cx="11" cy="11.5" rx="0.7" ry="1.1" fill="url(#catGrad)"/>
    <ellipse cx="17" cy="11.5" rx="0.7" ry="1.1" fill="url(#catGrad)"/>
    <!-- Eye shine -->
    <circle cx="11.4" cy="11" r="0.3" opacity="0.9"/>
    <circle cx="17.4" cy="11" r="0.3" opacity="0.9"/>
    <!-- Nose -->
    <path d="M13.2 13.5L14 14L14.8 13.5" stroke="url(#catGrad)" stroke-width="0.6" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mouth -->
    <path d="M14 14C14 14 12.8 14.8 12.3 14.6" stroke="url(#catGrad)" stroke-width="0.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M14 14C14 14 15.2 14.8 15.7 14.6" stroke="url(#catGrad)" stroke-width="0.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <!-- Left whiskers -->
    <line x1="3" y1="11.5" x2="8.5" y2="12" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="3" y1="13.2" x2="8.5" y2="13" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="3.5" y1="14.8" x2="8.5" y2="14" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.4" stroke-linecap="round"/>
    <!-- Right whiskers -->
    <line x1="25" y1="11.5" x2="19.5" y2="12" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="25" y1="13.2" x2="19.5" y2="13" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="24.5" y1="14.8" x2="19.5" y2="14" stroke="url(#catGrad)" stroke-width="0.5" opacity="0.4" stroke-linecap="round"/>
    <!-- Bell collar -->
    <path d="M9.5 16C9.5 16 11.5 17 14 17C16.5 17 18.5 16 18.5 16" stroke="url(#catGrad)" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- Bell -->
    <circle cx="14" cy="17.8" r="1.1" fill="url(#catGrad)" opacity="0.3"/>
    <circle cx="14" cy="17.8" r="0.45" fill="url(#catGrad)" opacity="0.5"/>
    <line x1="14" y1="17.3" x2="14" y2="18.3" stroke="url(#catGrad)" stroke-width="0.3" opacity="0.4"/>
  </g>
</g>
</svg>
